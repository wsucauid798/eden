name: Sync backlog to Project

on:
  push:
    paths:
      - '_docs/_development/**/*.md'
      - '_docs/_development/*.md'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-backlog
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure Project and PROJECT_NUMBER exist
        id: bootstrap
        env:
          # PROJECTS_TOKEN must be a PAT with `repo` + `project` scopes.
          # This is the single manual setup step — GitHub requires a human
          # to generate and store it.
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          EXISTING_NUMBER: ${{ vars.PROJECT_NUMBER }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # If a previous run set PROJECT_NUMBER, verify it still points at a
          # real project under @me. Stale values (e.g. from a failed run where
          # the PAT lacked write scope) would otherwise short-circuit us out
          # forever.
          # gh project link does a literal string compare of --owner against
          # the repo's owner login, so "@me" mismatches. Use the explicit
          # login derived from REPO for the link call.
          OWNER_LOGIN="${REPO%%/*}"

          if [[ -n "$EXISTING_NUMBER" ]]; then
            if gh project view "$EXISTING_NUMBER" --owner "@me" \
                 --format json >/dev/null 2>&1; then
              echo "PROJECT_NUMBER $EXISTING_NUMBER verified under @me"
              # Re-link every run — idempotent, self-heals if linking was
              # missed previously. Non-fatal if it fails.
              gh project link "$EXISTING_NUMBER" --owner "$OWNER_LOGIN" \
                --repo "$REPO" >/dev/null 2>&1 || true
              echo "number=$EXISTING_NUMBER" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "PROJECT_NUMBER=$EXISTING_NUMBER no longer resolves — recreating"
          fi

          echo "Creating 'Eden' Project under @me"
          N=$(gh project create --title "Eden" --owner "@me" \
                --format json | jq -r '.number')

          if [[ -z "$N" || "$N" == "null" ]]; then
            echo "ERROR: gh project create did not return a number" >&2
            exit 1
          fi

          echo "Created Project #$N"

          # Persist the number FIRST so a link failure doesn't cause another
          # fresh project to be created on the next run.
          gh variable set PROJECT_NUMBER --body "$N" --repo "$REPO"
          echo "number=$N" >> "$GITHUB_OUTPUT"

          # Link the new project to the repo so it appears on the repo's
          # Projects tab. Non-fatal — we already have a usable project.
          if ! gh project link "$N" --owner "$OWNER_LOGIN" --repo "$REPO"; then
            echo "WARN: failed to link Project #$N to $REPO — link manually if needed" >&2
          fi

      - name: Sync backlog to issues + Project
        env:
          GH_TOKEN: ${{ secrets.PROJECTS_TOKEN }}
          PROJECT_NUMBER: ${{ steps.bootstrap.outputs.number }}
        run: |
          chmod +x _dev/scripts/sync-backlog.sh
          shopt -s nullglob
          files=(_docs/_development/*.md)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "no backlog files found under _docs/_development/"
            exit 0
          fi
          ./_dev/scripts/sync-backlog.sh "${files[@]}"

      - name: Commit embedded issue numbers back to backlog
        run: |
          if ! git diff --quiet -- _docs/_development/; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _docs/_development/
            # [skip ci] prevents this commit from re-triggering this workflow.
            git commit -m "sync: embed issue numbers in backlog [skip ci]"
            git push
          else
            echo "no backlog changes to commit"
          fi
